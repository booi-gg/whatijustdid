    <script>
      window.__WHATIJUSTDID__ = [];
      window.__WHATIJUSTDID_PROJECTS__ = [];
    </script>
    <script src="./data.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="whatijustdid.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div>
          <p class="brandline">
            <span class="brand">
              <img
                class="brand-mark"
                src="https://res.cloudinary.com/dhhmap710/image/upload/v1784320394/wijd-logo_f2letb.svg"
                alt=""
                aria-hidden="true"
              />
              <span class="brand-name">whatijustdid</span>
            </span>
            <span class="brand-context">Repository ledger</span>
          </p>
          <h1>Change,<br />recorded.</h1>
        </div>
        <p class="summary" id="summary" aria-live="polite"></p>
      </header>

      <div class="toolbar">
        <nav
          class="filters"
          id="filters"
          aria-label="Filter changes by project"
        ></nav>
      </div>

      <main id="timeline"></main>
      <footer class="footer">
        <span
          >Generated with <span class="footer-brand">whatijustdid</span>.</span
        >
        <span>Only opted-in commits appear.</span>
      </footer>
    </div>

    <script>
      (() => {
        const rawGroups = Array.isArray(window.__WHATIJUSTDID__)
          ? window.__WHATIJUSTDID__
          : [];
        const configuredProjects = Array.isArray(
          window.__WHATIJUSTDID_PROJECTS__,
        )
          ? window.__WHATIJUSTDID_PROJECTS__
          : [];
        const knownTypes = new Set([
          "feat",
          "fix",
          "refactor",
          "perf",
          "chore",
          "docs",
          "test",
          "style",
          "build",
          "ci",
          "other",
        ]);
        const timeline = document.querySelector("#timeline");
        const filters = document.querySelector("#filters");
        const summary = document.querySelector("#summary");
        let activeProject = "All";

        const projects = [
          ...new Set(
            [
              ...configuredProjects,
              ...rawGroups.flatMap((group) =>
                Array.isArray(group.projects) ? group.projects : [],
              ),
            ].filter((project) => typeof project === "string" && project),
          ),
        ];
        const hasRepo = rawGroups.some(
          (group) => !Array.isArray(group.projects) || !group.projects.length,
        );
        const projectNames = ["All", ...projects, ...(hasRepo ? ["Repo"] : [])];
        const dayFormatter = new Intl.DateTimeFormat(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        const timeFormatter = new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit",
        });

        function matchesProject(group, project) {
          const groupProjects = Array.isArray(group.projects)
            ? group.projects
            : [];
          return (
            project === "All" ||
            (project === "Repo" && !groupProjects.length) ||
            groupProjects.includes(project)
          );
        }

        function projectCount(project) {
          return rawGroups.filter((group) => matchesProject(group, project))
            .length;
        }

        function renderFilters() {
          filters.replaceChildren(
            ...projectNames.map((project) => {
              const button = element("button", "filter");
              button.type = "button";
              button.setAttribute(
                "aria-pressed",
                String(project === activeProject),
              );
              button.append(document.createTextNode(project));
              const count = element(
                "span",
                "filter-count",
                String(projectCount(project)),
              );
              button.append(count);
              button.addEventListener("click", () => {
                activeProject = project;
                render();
              });
              return button;
            }),
          );
        }

        function render() {
          renderFilters();
          const visible = rawGroups
            .filter((group) => matchesProject(group, activeProject))
            .slice()
            .sort((a, b) => dateValue(b.date) - dateValue(a.date));
          const entryCount = visible.reduce(
            (total, group) =>
              total + (Array.isArray(group.entries) ? group.entries.length : 0),
            0,
          );
          summary.textContent = `${entryCount} ${entryCount === 1 ? "change" : "changes"} across ${visible.length} ${visible.length === 1 ? "commit" : "commits"} · ${activeProject}`;

          if (!visible.length) {
            const empty = element("div", "empty");
            empty.append(
              element(
                "strong",
                "",
                activeProject === "All"
                  ? "No recorded changes yet"
                  : `No changes for ${activeProject}`,
              ),
              document.createTextNode(
                "Commit with the changelog hooks installed, then reopen this file.",
              ),
            );
            timeline.replaceChildren(empty);
            return;
          }

          const days = new Map();
          for (const group of visible) {
            const key = localDateKey(group.date);
            if (!days.has(key)) days.set(key, []);
            days.get(key).push(group);
          }
          timeline.replaceChildren(
            ...[...days].map(([key, groups]) => daySection(key, groups)),
          );
        }

        function daySection(key, groups) {
          const section = element("section", "day");
          const heading = element("h2", "day-heading");
          const time = element("time", "", formatDay(key));
          time.dateTime = key;
          heading.append(time);
          const commits = element("div", "commits");
          commits.append(...groups.map(commitCard));
          section.append(heading, commits);
          return section;
        }

        function commitCard(group) {
          const isPullRequest = group.kind === "pr";
          const article = element(
            "article",
            isPullRequest ? "commit commit--pr" : "commit",
          );
          const meta = element("header", "commit-meta");
          meta.append(
            element("span", "kind", isPullRequest ? "PR" : "Commit"),
            element("code", "ref", String(group.ref || "change")),
            document.createTextNode(`by ${String(group.author || "Unknown")}`),
          );

          const groupProjects =
            Array.isArray(group.projects) && group.projects.length
              ? group.projects
              : ["Repo"];
          for (const project of groupProjects)
            meta.append(element("span", "project", String(project)));
          const date = new Date(group.date);
          if (!Number.isNaN(date.valueOf())) {
            const time = element("time", "", timeFormatter.format(date));
            time.dateTime = date.toISOString();
            meta.append(time);
          }
          const url = safeHttpUrl(group.link);
          if (group.usage) {
            const tokenSpan = element("span", "tokens");
            const total = group.usage.total ?? 0;
            if (total > 0) {
              tokenSpan.textContent =
                total >= 1000
                  ? `${(total / 1000).toFixed(1)}k tok`
                  : `${total} tok`;
            }
            meta.append(tokenSpan);
          }
          if (url) {
            const link = element("a", "commit-link", "View \u2192");
            link.href = url;
            link.target = "_blank";
            link.rel = "noreferrer";
            meta.append(link);
          }

          const entries = element("ol", "entries");
          const groupEntries = Array.isArray(group.entries)
            ? group.entries
            : [];
          entries.append(...groupEntries.map((entry) => entryRow(entry)));
          article.append(meta, entries);
          return article;
        }

        function entryRow(entry) {
          const item = element("li", "entry");
          const entryType =
            Array.isArray(entry.tags) && entry.tags.length
              ? entry.tags[0]
              : "other";
          const letterCls = knownTypes.has(entryType)
            ? `letter letter--${entryType}`
            : "letter";
          item.append(
            element("span", letterCls, String(entry.letter || "(·)")),
          );
          const body = element("div", "entry-body");
          const tags = element("div", "tags");
          const entryTags =
            Array.isArray(entry.tags) && entry.tags.length
              ? entry.tags
              : ["other"];
          for (const value of entryTags) {
            const type = knownTypes.has(value) ? value : "other";
            tags.append(element("span", `tag tag--${type}`, String(value)));
          }
          body.append(
            tags,
            element(
              "p",
              "description",
              String(entry.description || "Updated project files"),
            ),
          );
          item.append(body);
          return item;
        }

        function element(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        function dateValue(value) {
          const date = new Date(value).valueOf();
          return Number.isNaN(date) ? 0 : date;
        }

        function localDateKey(value) {
          const date = new Date(value);
          if (Number.isNaN(date.valueOf())) return "1970-01-01";
          const pad = (part) => String(part).padStart(2, "0");
          return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
        }

        function formatDay(key) {
          const date = new Date(`${key}T00:00:00`);
          return Number.isNaN(date.valueOf()) ? key : dayFormatter.format(date);
        }

        function safeHttpUrl(value) {
          if (typeof value !== "string" || !value) return null;
          try {
            const url = new URL(value);
            return url.protocol === "https:" || url.protocol === "http:"
              ? url.href
              : null;
          } catch {
            return null;
          }
        }

        render();
      })();
    </script>
  </body>
</html>

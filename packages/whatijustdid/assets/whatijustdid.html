<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>whatijustdid · Changelog</title>
    <meta
      name="description"
      content="A repository changelog recorded with whatijustdid."
    />
    <link
      rel="icon"
      href="https://res.cloudinary.com/dhhmap710/image/upload/v1784311641/Container_zccajb.svg"
    />
    <script>
      window.__CHANGELOG__ = [];
      window.__CHANGELOG_PROJECTS__ = [];
    </script>
    <script src="./data.js"></script>
    <style>
      :root {
        --paper: #eef3f6;
        --surface: #f9fbfc;
        --ink: #111a24;
        --muted: #66727f;
        --faint: #8a96a2;
        --line: #d4dde3;
        --line-strong: #b7c4cc;
        --blue: #0465af;
        --blue-soft: #e1edf7;
        --green: #08735d;
        --shadow: 0 18px 55px rgba(35, 52, 66, 0.09);
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--paper);
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 280px;
        min-height: 100vh;
        background:
          linear-gradient(rgba(41, 69, 87, 0.045) 1px, transparent 1px),
          var(--paper);
        background-size: 100% 28px;
      }

      button,
      a {
        font: inherit;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(4, 101, 175, 0.3);
        outline-offset: 3px;
      }

      .shell {
        width: min(900px, calc(100% - 40px));
        margin: 0 auto;
        padding: 68px 0 92px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 28px;
        align-items: end;
        padding: 0 4px 30px;
        border-bottom: 1px solid var(--line-strong);
      }

      .brandline {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 18px;
        color: var(--muted);
        font:
          700 10px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
      }

      .brand-mark {
        flex: none;
        width: 28px;
        height: 28px;
      }

      .brand-name {
        font-size: 12px;
        letter-spacing: -0.045em;
        text-transform: lowercase;
      }

      .brand-context {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .brand-context::before {
        width: 1px;
        height: 13px;
        background: var(--line-strong);
        content: "";
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font:
          720 clamp(38px, 7vw, 72px) / 0.94 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: -0.075em;
      }

      .summary {
        max-width: 230px;
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
        text-align: right;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        margin: 0 -14px 38px;
        padding: 15px 14px;
        background: rgba(238, 243, 246, 0.92);
        border-bottom: 1px solid rgba(183, 196, 204, 0.65);
        backdrop-filter: blur(14px);
      }

      .filters {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .filters::-webkit-scrollbar {
        display: none;
      }

      .filter {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 7px 8px 7px 12px;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        color: #3b4855;
        background: var(--surface);
        cursor: pointer;
        font-size: 12px;
        font-weight: 680;
      }

      .filter:hover {
        border-color: #91a1ac;
      }

      .filter[aria-pressed="true"] {
        border-color: var(--ink);
        color: #fff;
        background: var(--ink);
      }

      .filter-count {
        min-width: 20px;
        padding: 2px 5px;
        border-radius: 3px;
        color: var(--muted);
        background: #e6ecef;
        font:
          700 10px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        text-align: center;
      }

      .filter[aria-pressed="true"] .filter-count {
        color: #d9e2e8;
        background: rgba(255, 255, 255, 0.12);
      }

      .day {
        --thread-x: 16px;
        --content-inset: 58px;
        position: relative;
        min-width: 0;
        padding: 0 0 48px var(--content-inset);
      }

      .day:last-child {
        padding-bottom: 0;
      }

      .day::before {
        content: "";
        position: absolute;
        left: var(--thread-x);
        top: 9px;
        bottom: -12px;
        width: 1px;
        background: var(--line-strong);
      }

      .day:last-child::before {
        bottom: 0;
      }

      .day-heading {
        position: relative;
        margin: 0 0 24px;
        color: var(--muted);
        font:
          700 13px/18px ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: -0.015em;
      }

      .day-heading::before {
        content: "";
        position: absolute;
        left: calc(var(--thread-x) - var(--content-inset) - 9px);
        top: 0;
        width: 18px;
        height: 18px;
        border: 3px solid #7d8893;
        border-radius: 50%;
        background: var(--paper);
        box-shadow: 0 0 0 4px var(--paper);
      }

      .commits {
        display: grid;
        min-width: 0;
        gap: 28px;
      }

      .commit {
        position: relative;
        min-width: 0;
        max-width: 100%;
      }

      .commit::before {
        content: "";
        position: absolute;
        z-index: 1;
        left: calc(var(--thread-x) - var(--content-inset) - 7px);
        top: 2px;
        width: 14px;
        height: 14px;
        border: 3px solid var(--paper);
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 1px var(--line-strong);
      }

      .commit--pr::before {
        background: #8868cf;
      }

      .commit:hover .entries {
        border-color: #bcc9d1;
        box-shadow: var(--shadow);
      }

      .commit-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 18px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        flex-wrap: wrap;
      }

      .kind {
        padding: 3px 6px;
        border-radius: 3px;
        color: #075c9d;
        background: #dceaf7;
        font:
          750 10px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .commit--pr .kind {
        color: #6845a5;
        background: #eee6fb;
      }

      .ref {
        color: var(--ink);
        font:
          750 13px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      .project {
        padding: 2px 6px;
        border: 1px solid #ccd8f2;
        border-radius: 3px;
        color: #34529d;
        background: #edf2ff;
        font-size: 10px;
        font-weight: 700;
      }

      .commit-link {
        margin-left: auto;
        color: var(--blue);
        font-weight: 700;
        text-decoration: none;
      }

      .commit-link:hover {
        text-decoration: underline;
      }

      .entries {
        display: grid;
        gap: 14px;
        margin: 0;
        padding: 16px 18px 17px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 1px 0 rgba(17, 26, 36, 0.03);
        list-style: none;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      .entry {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
      }

      .entry + .entry {
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .letter {
        min-width: 32px;
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--blue);
        background: var(--blue-soft);
        font:
          750 11px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        text-align: center;
      }

      .entry-body {
        min-width: 0;
      }

      .tags {
        display: flex;
        gap: 5px;
        margin-bottom: 4px;
        flex-wrap: wrap;
      }

      .tag {
        padding: 2px 6px;
        border-radius: 3px;
        color: #53606c;
        background: #e8edef;
        font:
          700 9px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      .tag--feat {
        color: #096348;
        background: #dff2e9;
      }
      .tag--fix {
        color: #a33931;
        background: #f9e7e4;
      }
      .tag--perf {
        color: #8a5a00;
        background: #f8edce;
      }
      .tag--docs {
        color: #6d43a1;
        background: #eee5f8;
      }
      .tag--test,
      .tag--ci {
        color: #16647b;
        background: #dceff4;
      }
      .tag--refactor {
        color: #3157a3;
        background: #e2e9f8;
      }

      .description {
        margin: 0;
        color: #2d3945;
        font-size: 13.5px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .empty {
        padding: 48px 24px;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        color: var(--muted);
        background: rgba(249, 251, 252, 0.6);
        text-align: center;
      }

      .empty strong {
        display: block;
        margin-bottom: 8px;
        color: var(--ink);
        font:
          700 15px/1.3 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        margin: 52px 0 0 58px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font:
          600 10px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      .footer-brand {
        color: var(--ink);
        font-weight: 750;
      }

      @media (max-width: 700px) {
        .shell {
          width: min(100% - 28px, 900px);
          padding-top: 42px;
        }
        .masthead {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .summary {
          max-width: none;
          text-align: left;
        }
        .day {
          --thread-x: 7px;
          --content-inset: 34px;
          width: 100%;
        }
        .day-heading {
          font-size: 12px;
        }
        .entries {
          padding-inline: 14px;
        }
        .footer {
          flex-direction: column;
          margin-left: 34px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .entries {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div>
          <p class="brandline">
            <span class="brand">
              <img
                class="brand-mark"
                src="https://res.cloudinary.com/dhhmap710/image/upload/v1784311641/Container_zccajb.svg"
                alt=""
                aria-hidden="true"
              />
              <span class="brand-name">whatijustdid</span>
            </span>
            <span class="brand-context">Repository ledger</span>
          </p>
          <h1>Change,<br />recorded.</h1>
        </div>
        <p class="summary" id="summary" aria-live="polite"></p>
      </header>

      <div class="toolbar">
        <nav
          class="filters"
          id="filters"
          aria-label="Filter changes by project"
        ></nav>
      </div>

      <main id="timeline"></main>
      <footer class="footer">
        <span
          >Generated with <span class="footer-brand">whatijustdid</span>.</span
        >
        <span>Only opted-in commits appear.</span>
      </footer>
    </div>

    <script>
      (() => {
        const rawGroups = Array.isArray(window.__CHANGELOG__)
          ? window.__CHANGELOG__
          : [];
        const configuredProjects = Array.isArray(window.__CHANGELOG_PROJECTS__)
          ? window.__CHANGELOG_PROJECTS__
          : [];
        const knownTypes = new Set([
          "feat",
          "fix",
          "refactor",
          "perf",
          "chore",
          "docs",
          "test",
          "style",
          "build",
          "ci",
          "other",
        ]);
        const timeline = document.querySelector("#timeline");
        const filters = document.querySelector("#filters");
        const summary = document.querySelector("#summary");
        let activeProject = "All";

        const projects = [
          ...new Set(
            [
              ...configuredProjects,
              ...rawGroups.flatMap((group) =>
                Array.isArray(group.projects) ? group.projects : [],
              ),
            ].filter((project) => typeof project === "string" && project),
          ),
        ];
        const hasRepo = rawGroups.some(
          (group) => !Array.isArray(group.projects) || !group.projects.length,
        );
        const projectNames = ["All", ...projects, ...(hasRepo ? ["Repo"] : [])];
        const dayFormatter = new Intl.DateTimeFormat(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        const timeFormatter = new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit",
        });

        function matchesProject(group, project) {
          const groupProjects = Array.isArray(group.projects)
            ? group.projects
            : [];
          return (
            project === "All" ||
            (project === "Repo" && !groupProjects.length) ||
            groupProjects.includes(project)
          );
        }

        function projectCount(project) {
          return rawGroups.filter((group) => matchesProject(group, project))
            .length;
        }

        function renderFilters() {
          filters.replaceChildren(
            ...projectNames.map((project) => {
              const button = element("button", "filter");
              button.type = "button";
              button.setAttribute(
                "aria-pressed",
                String(project === activeProject),
              );
              button.append(document.createTextNode(project));
              const count = element(
                "span",
                "filter-count",
                String(projectCount(project)),
              );
              button.append(count);
              button.addEventListener("click", () => {
                activeProject = project;
                render();
              });
              return button;
            }),
          );
        }

        function render() {
          renderFilters();
          const visible = rawGroups
            .filter((group) => matchesProject(group, activeProject))
            .slice()
            .sort((a, b) => dateValue(b.date) - dateValue(a.date));
          const entryCount = visible.reduce(
            (total, group) =>
              total + (Array.isArray(group.entries) ? group.entries.length : 0),
            0,
          );
          summary.textContent = `${entryCount} ${entryCount === 1 ? "change" : "changes"} across ${visible.length} ${visible.length === 1 ? "commit" : "commits"} · ${activeProject}`;

          if (!visible.length) {
            const empty = element("div", "empty");
            empty.append(
              element(
                "strong",
                "",
                activeProject === "All"
                  ? "No recorded changes yet"
                  : `No changes for ${activeProject}`,
              ),
              document.createTextNode(
                "Commit with the changelog hooks installed, then reopen this file.",
              ),
            );
            timeline.replaceChildren(empty);
            return;
          }

          const days = new Map();
          for (const group of visible) {
            const key = localDateKey(group.date);
            if (!days.has(key)) days.set(key, []);
            days.get(key).push(group);
          }
          timeline.replaceChildren(
            ...[...days].map(([key, groups]) => daySection(key, groups)),
          );
        }

        function daySection(key, groups) {
          const section = element("section", "day");
          const heading = element("h2", "day-heading");
          const time = element("time", "", formatDay(key));
          time.dateTime = key;
          heading.append(time);
          const commits = element("div", "commits");
          commits.append(...groups.map(commitCard));
          section.append(heading, commits);
          return section;
        }

        function commitCard(group) {
          const isPullRequest = group.kind === "pr";
          const article = element(
            "article",
            isPullRequest ? "commit commit--pr" : "commit",
          );
          const meta = element("header", "commit-meta");
          meta.append(
            element("span", "kind", isPullRequest ? "PR" : "Commit"),
            element("code", "ref", String(group.ref || "change")),
            document.createTextNode(`by ${String(group.author || "Unknown")}`),
          );

          const groupProjects =
            Array.isArray(group.projects) && group.projects.length
              ? group.projects
              : ["Repo"];
          for (const project of groupProjects)
            meta.append(element("span", "project", String(project)));
          const date = new Date(group.date);
          if (!Number.isNaN(date.valueOf())) {
            const time = element("time", "", timeFormatter.format(date));
            time.dateTime = date.toISOString();
            meta.append(time);
          }
          const url = safeHttpUrl(group.link);
          if (url) {
            const link = element("a", "commit-link", "View →");
            link.href = url;
            link.target = "_blank";
            link.rel = "noreferrer";
            meta.append(link);
          }

          const entries = element("ol", "entries");
          const groupEntries = Array.isArray(group.entries)
            ? group.entries
            : [];
          entries.append(...groupEntries.map((entry) => entryRow(entry)));
          article.append(meta, entries);
          return article;
        }

        function entryRow(entry) {
          const item = element("li", "entry");
          item.append(element("span", "letter", String(entry.letter || "(·)")));
          const body = element("div", "entry-body");
          const tags = element("div", "tags");
          const entryTags =
            Array.isArray(entry.tags) && entry.tags.length
              ? entry.tags
              : ["other"];
          for (const value of entryTags) {
            const type = knownTypes.has(value) ? value : "other";
            tags.append(element("span", `tag tag--${type}`, String(value)));
          }
          body.append(
            tags,
            element(
              "p",
              "description",
              String(entry.description || "Updated project files"),
            ),
          );
          item.append(body);
          return item;
        }

        function element(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        function dateValue(value) {
          const date = new Date(value).valueOf();
          return Number.isNaN(date) ? 0 : date;
        }

        function localDateKey(value) {
          const date = new Date(value);
          if (Number.isNaN(date.valueOf())) return "1970-01-01";
          const pad = (part) => String(part).padStart(2, "0");
          return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
        }

        function formatDay(key) {
          const date = new Date(`${key}T00:00:00`);
          return Number.isNaN(date.valueOf()) ? key : dayFormatter.format(date);
        }

        function safeHttpUrl(value) {
          if (typeof value !== "string" || !value) return null;
          try {
            const url = new URL(value);
            return url.protocol === "https:" || url.protocol === "http:"
              ? url.href
              : null;
          } catch {
            return null;
          }
        }

        render();
      })();
    </script>
  </body>
</html>
